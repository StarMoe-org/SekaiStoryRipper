[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StarMoe-org/SekaiStoryRipper"
publish = false

[workspace.dependencies]
ripper-format = { path = "crates/ripper-format" }
ripper-cdn = { path = "crates/ripper-cdn" }
ripper-unity = { path = "crates/ripper-unity" }
ripper-convert = { path = "crates/ripper-convert" }
ripper-resolve = { path = "crates/ripper-resolve" }

aes = "0.9"
anyhow = "1"
cbc = { version = "0.2", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
cridecoder = { version = "0.3.5", default-features = false }
png = "0.18"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
unity-rs-core = "0.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
