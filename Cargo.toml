[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StarMoe-org/SekaiStoryRipper"
publish = false

[workspace.dependencies]
ripper-format = { path = "crates/ripper-format" }
ripper-cdn = { path = "crates/ripper-cdn" }
ripper-unity = { path = "crates/ripper-unity" }
ripper-convert = { path = "crates/ripper-convert" }
ripper-resolve = { path = "crates/ripper-resolve" }

aes = "0.9"
anyhow = "1"
cbc = { version = "0.2", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
# JP install id (already in the tree through ring).
getrandom = "0.2"
cridecoder = { version = "0.3.5", default-features = false }
png = "0.18"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
rmp-serde = "1"
# TLS: rustls with the `ring` provider and bundled webpki roots. No aws-lc/OpenSSL, so the only
# C code in the tree stays zstd-sys and every platform (incl. musl) trusts the same roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
toml = "0.9"
unity-rs-core = "0.5.1"
webpki-roots = "1"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
