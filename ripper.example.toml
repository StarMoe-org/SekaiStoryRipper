# SekaiStoryRipper configuration. Copy to `ripper.toml` (git-ignored) and edit.
# Every value below is the built-in default; delete what you do not change.

[cdn]
# "cn" or "jp" (or pass --region). The region picks every default below; the values shown are CN's.
# For JP, `region = "jp"` alone is enough: it logs in with a guest account kept in
# <cache>/account.json and uses cache/jp, out/jp. JP-only settings live in [cdn.jp]
# (version_api, app_hash, bundle_host, info_host, signed_cookie_url, asset_hash, device_model,
# operating_system); see crates/ripper-cdn/src/config.rs.
region = "cn"
hosts = [
    "https://lf3-mkcncdn-tos.dailygn.com",
    "https://lf6-mkcncdn-tos.dailygn.com",
    "https://lf9-mkcncdn-tos.dailygn.com",
    "https://lf26-mkcncdn-tos.dailygn.com",
]
app_version = "6.4.0"
# asset_version = "10"      # pin ios{N} (JP: "6.8.0.50" plus cdn.jp.asset_hash); by default the server is asked
app_id = "gdl_app_5236"
channel = "cn_online"
platform = "ios"
user_agent = "cn/4424 CFNetwork/3896.100.1.1.1 Darwin/27.0.0"
unity_version = "2022.3.62f3"
concurrency = 8
retries = 4
timeout_secs = 600

[crypto]
# The ABCrypt manifest key/IV are not shipped with this tool. Extract them from a client you
# legitimately own and set them here or via RIPPER_AB_KEY / RIPPER_AB_IV
# (16-character strings or 32 hex digits). JP uses a single pair for its manifest and its API.
# ab_key = ""
# ab_iv = ""

[masterdata]
url_template = "https://raw.githubusercontent.com/Team-Haruki/haruki-sekai-sc-master/HEAD/master/{name}.json"

[paths]
cache = "cache"
# A directory, or s3://bucket/prefix to publish the library to S3 (see [s3]; ADR-0012).
out = "out"

[s3]
# Used when paths.out (or --out) is s3://bucket/prefix. Credentials come only from the environment:
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN when needed).
# endpoint = "https://<account>.r2.cloudflarestorage.com"   # unset: AWS, or AWS_ENDPOINT_URL(_S3)
# region = "auto"                                            # unset: AWS_REGION, else us-east-1
# addressing_style = "auto"                                  # auto | path | virtual
concurrency = 16

[unity]
version = "2022.3.62f3"

[tools]
ffmpeg = "ffmpeg"
